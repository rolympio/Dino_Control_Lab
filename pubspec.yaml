name: dino_control_lab
description: Jogo offline e laboratório reprodutível de controle em Flutter e Flame.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '^3.14.0'
  flutter: '>=3.50.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flame: ^1.32.0
  material_ui: ^1.11.1
  shared_preferences: ^2.5.3
  file_selector: ^1.0.3
  path_provider: ^2.1.5
  share_plus: ^12.0.0
  audioplayers: ^6.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/audio/
